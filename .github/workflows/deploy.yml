# Production host is Cloudflare Pages (arrowlogy.com → arrowlogy-cts.pages.dev).
# GitHub Pages is NOT enabled on this repo, so the old push-triggered deploy
# failed on every commit and emailed failure noise. Keep this file for a
# manual fallback only — do not re-enable push triggers unless Pages is set up.
name: Deploy to GitHub Pages (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The repo root is the site's public folder.
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
